{% extends "layout.html" %}

{% block title %}Register | Personal Expense Tracker{% endblock %}

{% block content %}
<section class="auth-shell">
    <div class="auth-panel">
        <h1>Register</h1>
        <form method="post" class="stacked-form">
            <label>
                Username
                <input type="text" name="username" autocomplete="username" minlength="3" maxlength="50" required>
            </label>
            <label>
                Email
                <input type="email" name="email" autocomplete="email" required>
            </label>
            <label>
                Password
                <input type="password" name="password" autocomplete="new-password" minlength="6" required>
            </label>
            <button class="btn btn-primary" type="submit">Create Account</button>
        </form>
        <p class="muted">Already registered? <a href="{{ url_for('main.login') }}">Log in</a>.</p>
    </div>
</section>
{% endblock %}
